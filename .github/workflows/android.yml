name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug --verbose
          status=$?
          set -e
          apk=$(find . -type f -path '*/outputs/*' -name 'app-debug.apk' -print -quit)
          test -n "$apk"
          mkdir -p build/app/outputs/flutter-apk
          cp "$apk" build/app/outputs/flutter-apk/app-debug.apk
          test "$status" -eq 0 || echo "Flutter returned $status after producing the APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trackit-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
